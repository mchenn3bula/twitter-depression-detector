[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keyword-robustness"
version = "0.1.0"
description = "Reproducible BERT text classification and keyword robustness experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2", "joblib>=1.4,<2", "torch>=2.6,<3", "transformers>=4.45,<6"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
keyword-study = "keyword_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
